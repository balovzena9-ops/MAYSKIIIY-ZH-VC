<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MAYSKIIIY ZH&VC — загрузка</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#0a0a0a;color:#fff;
    font-family:'Segoe UI',-apple-system,Roboto,sans-serif;
    overflow:hidden;user-select:none;
    -webkit-app-region:drag;
  }
  .wrap{
    width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:22px;padding:28px;
  }
  .wrap::before{
    content:'';position:absolute;inset:-40%;
    background:conic-gradient(from 0deg,
      rgba(255,58,138,.28), rgba(168,85,247,.28),
      rgba(78,168,255,.28), rgba(168,85,247,.28), rgba(255,58,138,.28));
    filter:blur(90px);
    animation:spin 14s linear infinite;
    z-index:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .logo{
    position:relative;z-index:1;
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(90deg,#ff6fb3,#a855f7 50%,#4ea8ff);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:flow 3s linear infinite;
    filter:drop-shadow(0 0 26px rgba(255,58,138,.55));
    white-space:nowrap;
  }
  @keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .sub{
    position:relative;z-index:1;
    font-size:11px;font-weight:700;letter-spacing:3px;
    text-transform:uppercase;color:rgba(255,255,255,.5);
  }
  .spinner{
    position:relative;z-index:1;
    width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#ff3a8a;
    border-right-color:#a855f7;
    animation:rot 1s linear infinite;
    box-shadow:0 0 30px rgba(255,58,138,.35);
  }
  @keyframes rot{to{transform:rotate(360deg);}}
  .bar{
    position:relative;z-index:1;
    width:220px;height:4px;border-radius:999px;
    background:rgba(255,255,255,.08);overflow:hidden;
  }
  .bar::after{
    content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,#ff3a8a,#a855f7,#4ea8ff);
    border-radius:999px;
    animation:load 1.4s ease-in-out infinite;
  }
  @keyframes load{
    0%{left:-40%;}
    100%{left:100%;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">MAYSKIIIY ZH&amp;VC</div>
    <div class="spinner"></div>
    <div class="bar"></div>
    <div class="sub">Загрузка приложения</div>
  </div>
</body>
</html>
