name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build for Windows x64
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List built files
        run: dir dist
        shell: cmd

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: MAYSKIIIY-ZH-VC-Windows-x64
          path: dist/*.exe
          retention-days: 30

      - name: Create Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MAYSKIIIY ZH&VC — сборка ${{ github.run_number }}
          body: |
            ## 🎵 MAYSKIIIY ZH&VC

            Готовое приложение для Windows x64.

            **Скачай один из файлов ниже:**
            - `MAYSKIIIY-ZH-VC-Setup-*.exe` — установщик (ярлык на рабочем столе)
            - `MAYSKIIIY-ZH-VC-Portable-*.exe` — портативная версия (без установки)
          files: |
            dist/*.exe
          draft: false
          prerelease: false
